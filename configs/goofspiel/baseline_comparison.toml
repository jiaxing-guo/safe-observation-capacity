








[experiment]
kind = "baseline_comparison"
name = "baseline_comparison_goofspiel"

[suite]
game = "goofspiel"

[run]
rounds = 60
episodes_per_round = 200
seeds = [42, 43, 44, 45, 46]
workers = 10

[confidence]
delta = 0.05
method = "empirical_bernstein"

[safety]
eps_safe = 0.0

[probe]
rnr_ps = [0.25, 0.5]
beta = 2.0
per_round_budget = 0.5

[output]
dir = "results"
figures = true
